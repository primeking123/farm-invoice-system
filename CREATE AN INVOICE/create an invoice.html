<DOCTYPE! html>
<html lang="en">
<head>
<title>
<p>Create Invoice</p>
</title>
<body>
<h1><strong><en>CREATE INVOICE</en></strong></h1>
<main>
<section>
<h2>New invoice<h2>
<button>Save draft </button>
</section> 
<section>
<ol>
<li>Season and Buyer</li>
<li>Items sold</li>
<li>Terms</li>
<li>Preview and send</li>
</ol>
</section>
<section>
<h2>Season and Buyer<h2>
<select>
<option value="">Choose</option>
<option>Quarter 1 2026</option>
<option>Quarter 2 2026</option>
<option>Quarter 3 2026</option>
</select>
 <label for="buyer">Buyer Name</label>
<input type="text"name="buyer">
<p><a href="#">Add a new buyer</a></p>
</section>
<section>
<h2>Items sold </h2>
<table>
<thead>
<tr>
<th>Item</th>
<th>Quantity</th>
<th>Unit</th>
<th>Price</th>
<th>Total</th>
</tr>
</thead>
<tr>
<td>
<select>
<option>Maize</option>
<option>Beans</option>
<option>Coffee</option>
</select>
<td><input tpye="number"></td>
<td><input type="number"></td>
<td><input type="cur"></td>
<td><input type="cur"></td>
</tr>
</thead>
</table>
</section>
<section>
<h3>Terms<h3>
<label for="num">Invoice number </label>
<input type="number" value="INV-0001">
<label for="issue">Issue Date</label>
<input type="date">
<label for="due">Due Date</label>
<input type="date">
<label for="cur">Currency</label>
<select>
<option>UGX</option>
</select>
<label for="tax">Tax</label>
<input type="number"><br>
<label for="pay">Paymentinstructions</label><br>
<input type="num" placeholder="Mobile money"><br>
<label for="notes">Notes</label><br>
<textarea id="notes"rows="1" cols="10"></textarea>
</section>
<section>
<h2>PREVIEW AND SEND</h2>
<label for="method">send method</label>
<select>
<option>Email</option>
<option>Whatsapp</option>
</select> 
<button><strong>Send invoice</strong></button>
<aside>
<h2>Summary </h2>
<p>Subtotal:0</p>
<p>Tax:0</p>
<p><en>Total:0</en></p>
</aside>
</main>
</body>
</html>
