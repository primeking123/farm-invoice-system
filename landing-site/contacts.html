<section class="contact-section">
    <div class="contact-inner">
        <h2>Contact Us</h2>
        <p class="contact-subtitle">
            Have a question or need help? Reach out and we'll get back to you soon.
        </p>

        <form class="contact-form">
            <div class="form-group">
                <label for="contact-name">Name</label>
                <input type="text" id="contact-name" class="form-control" placeholder="Your full name" required>
            </div>

            <div class="form-group">
                <label for="contact-email">Email address</label>
                <input type="email" id="contact-email" class="form-control" placeholder="name@example.com" required>
                <small class="form-help">We'll never share your email with anyone else.</small>
            </div>

            <div class="form-group">
                <label for="contact-subject">Subject</label>
                <input type="text" id="contact-subject" class="form-control" placeholder="What is this about?">
            </div>

            <div class="form-group">
                <label for="contact-message">Message</label>
                <textarea id="contact-message" class="form-control" rows="5" placeholder="Type your message here..." required></textarea>
            </div>

            <button type="submit" class="btn btn-primary btn-submit">Send Message</button>
        </form>
    </div>
</section>
