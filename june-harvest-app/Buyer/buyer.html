<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>June Harvest | Buyers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="../sidebar/sidebar.css">
    <link rel="stylesheet" href="buyer.css">
</head>
<body>
    <div class="layout">
        <aside>
            <div id="sidebar"></div>
        </aside>
        <main class="content">
            <header>
                <h1>Buyers</h1>
                <button>Add Buyer</button>
            </header>

            <div class="summary-grid">
                <div class="summary-card">
                    <h3>Total Buyers</h3>
                    <div class="value">0</div>
                </div>
                <div class="summary-card">
                    <h3>Total Invoiced</h3>
                    <div class="value">0</div>
                </div>
                <div class="summary-card">
                    <h3>Outstanding</h3>
                    <div class="value">0</div>
                </div>
            </div>

            <div class="navbar">
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search buyers..." aria-label="Search">
                    <button class="btn-outline theme-success" type="submit">Search</button>
                </form>
            </div>

            <section>
                <h3>Buyer List</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Buyer Name</th>
                            <th>Contact</th>
                            <th>Invoice Count</th>
                            <th>Total Invoiced</th>
                            <th>Outstanding</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="6" style="text-align:center; color: var(--color-text-secondary);">No buyers added yet</td>
                        </tr>
                    </tbody>
                </table>
            </section>

            <section>
                <h3>Add / Edit Buyer</h3>
                <form class="form-grid">
                    <div class="form-group">
                        <label for="buyer-name">Name</label>
                        <input type="text" id="buyer-name" class="form-control" placeholder="Buyer full name" required>
                    </div>
                    <div class="form-group">
                        <label for="buyer-phone">Phone</label>
                        <input type="tel" id="buyer-phone" class="form-control" placeholder="Phone number">
                    </div>
                    <div class="form-group">
                        <label for="buyer-email">Email</label>
                        <input type="email" id="buyer-email" class="form-control" placeholder="Email address">
                    </div>
                    <div class="form-group">
                        <label for="buyer-notes">Notes</label>
                        <textarea id="buyer-notes" class="form-control" rows="3" placeholder="Optional notes"></textarea>
                    </div>
                    <div class="form-group" style="display:flex; gap:0.5rem;">
                        <button type="submit" style="flex:1;">Save Buyer</button>
                        <button type="reset" style="flex:1; background-color: var(--bg-sub); color: var(--secondary);">Cancel</button>
                    </div>
                </form>
            </section>

            <section>
                <h3>Buyer Details</h3>
                <div class="detail-grid">
                    <div class="detail-card">
                        <h4>Buyer Summary</h4>
                        <p>Total Invoiced: <strong>0</strong></p>
                        <p>Paid: <strong>0</strong></p>
                        <p>Outstanding: <strong>0</strong></p>
                    </div>
                    <div class="detail-card">
                        <h4>Buyer Invoices</h4>
                        <p>No invoices yet</p>
                        <button>Add Invoice</button>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <script src="../assets/sidebar.js"></script>
</body>
</html>
