<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="seasons.css">
        <title>Seasons</title>
    </head>
    <body>
        <h1>Seasons</h1>

        <div class="season-row">
            <div class="season-card">
                <h2>Summer</h2>
                <p>This is summer</p>
            </div>
            <div class="season-card">
                <h2>Autumn</h2>
                <p>This is autumn</p>
            </div>
            <div class="season-card">
                <h2>Winter</h2>
                <p>This is winter</p>
            </div>
        </div>

        <div class="season-created">
            <h2>Season Created</h2>
            <p>Missing informations</p>
            <table>
                <tr>
                <th>
                    Crop
                </th>
                <th>
                    Variety
                </th>
                <th>
                    On hand
                </th>
                <th>
                    Recored
                </th>
                <th>
                    Status
                </th>
                <th>
                    Action
                </th>
                </tr>
                <tr>
                    <td>Maize</td>
                    <td>2</td>
                    <td>Yes</td>
                    <td>200kg</td>
                    <td>Ongoing</td>
                    <td>Planting</td>
                </tr>
            </table>
        </div>
        <div class="Contain">
            <h2>Contain</h2>
        </div>
    </body>
</html>
