<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Invoice | June Harvest</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../sidebar/sidebar.css">
    <link rel="stylesheet" href="../assets/app.css">
    <link rel="stylesheet" href="create-invoice.css">
</head>
<body>
    <div class="layout">
        <aside class="app-sidebar">
            <div id="sidebar"></div>
        </aside>

        <div class="page-content">
            <header class="page-header">
                <div class="page-title-group">
                    <p class="page-eyebrow">Sales</p>
                    <h1>Create invoice</h1>
                </div>
                <button class="btn btn-secondary" type="button" id="saveDraftBtn">Save draft</button>
            </header>

            <div class="page-body">
                <form id="invoiceForm" novalidate>
                    <div class="invoice-layout">

                        <!-- Left column: form sections -->
                        <div class="invoice-sections">

                            <!-- Buyer & season -->
                            <section class="panel" aria-labelledby="buyer-season-heading">
                                <h2 class="panel-heading" id="buyer-season-heading">Buyer and season</h2>
                                <div class="form-grid" style="margin-top: 12px;">
                                    <div class="form-field">
                                        <label for="invoiceSeason">Season</label>
                                        <select id="invoiceSeason" name="season" required>
                                            <option value="">Choose a season</option>
                                        </select>
                                    </div>
                                    <div class="form-field">
                                        <label for="invoiceBuyer">Buyer</label>
                                        <select id="invoiceBuyer" name="buyer" required>
                                            <option value="">Choose a buyer</option>
                                        </select>
                                        <a class="field-link" href="../Buyer/buyer.html">+ Add a new buyer</a>
                                    </div>
                                </div>
                            </section>

                            <!-- Line items -->
                            <section class="panel" aria-labelledby="items-heading">
                                <h2 class="panel-heading" id="items-heading">Items sold</h2>
                                <div class="table-scroll" style="margin-top:12px;">
                                    <table class="data-table items-table" id="itemsTable">
                                        <thead>
                                            <tr>
                                                <th scope="col">Description</th>
                                                <th scope="col">Qty</th>
                                                <th scope="col">Unit</th>
                                                <th scope="col">Unit price (UGX)</th>
                                                <th scope="col">Line total (UGX)</th>
                                                <th scope="col"><span class="sr-only">Remove</span></th>
                                            </tr>
                                        </thead>
                                        <tbody id="itemsBody">
                                            <!-- rows injected by JS -->
                                        </tbody>
                                    </table>
                                </div>
                                <button class="btn btn-secondary" type="button" id="addItemBtn"
                                    style="margin-top:10px;">
                                    <i class="bi bi-plus" aria-hidden="true"></i>
                                    Add item
                                </button>
                            </section>

                            <!-- Terms -->
                            <section class="panel" aria-labelledby="terms-heading">
                                <h2 class="panel-heading" id="terms-heading">Terms</h2>
                                <div class="form-grid" style="margin-top:12px;">
                                    <div class="form-field">
                                        <label for="invoiceNumber">Invoice number</label>
                                        <input id="invoiceNumber" name="invoiceNumber" type="text" readonly>
                                    </div>
                                    <div class="form-field">
                                        <label for="issueDate">Issue date</label>
                                        <input id="issueDate" name="issueDate" type="date" required>
                                    </div>
                                    <div class="form-field">
                                        <label for="dueDate">Due date</label>
                                        <input id="dueDate" name="dueDate" type="date">
                                    </div>
                                    <div class="form-field">
                                        <label for="taxRate">Tax (%)</label>
                                        <input id="taxRate" name="tax" type="number" min="0" max="100" step="0.01" value="0">
                                    </div>
                                    <div class="form-field field-full">
                                        <label for="paymentInstructions">Payment instructions</label>
                                        <input id="paymentInstructions" name="paymentInstructions" type="text"
                                            placeholder="Mobile Money number or bank transfer details">
                                    </div>
                                    <div class="form-field field-full">
                                        <label for="invoiceNotes">Notes</label>
                                        <textarea id="invoiceNotes" name="notes" rows="3"></textarea>
                                    </div>
                                </div>
                            </section>
                        </div>

                        <!-- Right column: summary + send -->
                        <aside class="panel invoice-summary" aria-labelledby="summary-heading">
                            <h2 class="panel-heading" id="summary-heading">Invoice summary</h2>

                            <dl class="summary-dl">
                                <div class="summary-row">
                                    <dt>Subtotal</dt>
                                    <dd id="summarySubtotal">UGX 0</dd>
                                </div>
                                <div class="summary-row">
                                    <dt>Tax</dt>
                                    <dd id="summaryTax">UGX 0</dd>
                                </div>
                                <div class="summary-row summary-total-row">
                                    <dt>Total</dt>
                                    <dd id="summaryTotal">UGX 0</dd>
                                </div>
                            </dl>

                            <div class="form-stack" style="margin-top:16px;">
                                <div class="form-field">
                                    <label for="invoiceStatus">Status</label>
                                    <select id="invoiceStatus" name="status">
                                        <option value="outstanding">Outstanding</option>
                                        <option value="paid">Paid</option>
                                        <option value="overdue">Overdue</option>
                                    </select>
                                </div>
                            </div>

                            <div style="margin-top:16px; display:flex; flex-direction:column; gap:8px;">
                                <button class="btn btn-primary" type="submit" form="invoiceForm">
                                    Save invoice
                                </button>
                            </div>
                            <p class="form-message" id="invoiceMessage" aria-live="polite" role="status"
                                style="margin-top:10px;"></p>
                        </aside>

                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="../assets/sidebar.js"></script>
    <script src="create-invoice.js"></script>
</body>
</html>
