<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Create Invoice | June Harvest</title>
	<link rel="stylesheet" href="../sidebar/sidebar.css">
	<link rel="stylesheet" href="create-invoice.css">
</head>
<body>
	<div class="layout">
		<aside class="sidebar" aria-label="Main navigation">
			<div id="sidebar"></div>
		</aside>

		<main class="content">
			<header class="page-header">
				<div>
					<p class="eyebrow">Sales</p>
					<h1>Create invoice</h1>
				</div>
				<button class="button button-secondary" type="button">Save draft</button>
			</header>

			<form>
				<div class="form-layout">
					<div class="form-sections">
						<section class="panel">
							<h2>Buyer and season</h2>
							<div class="field-grid">
								<div class="form-field">
									<label for="season">Season</label>
									<select id="season" name="season" required>
										<option value="">Choose a season</option>
										<option>Quarter 1, 2026</option>
										<option>Quarter 2, 2026</option>
										<option>Quarter 3, 2026</option>
										<option>Quarter 4, 2026</option>

				         </select>

								</div>
								<div class="form-field">
									<label for="buyer">Buyer</label>
									<select id="buyer" name="buyer" required>
										<option value="">Choose a buyer</option>
										<option>Kampala Fresh Produce Ltd.</option>
										<option>Jinja Grain Traders</option>
										<option>Mbarara Produce Cooperative</option>
										<option>Gulu Agro Supplies</option>
									</select>
									<a class="field-link" href="../Buyer/buyer.html">Add a new buyer</a>
								</div>
							</div>
						</section>

						<section class="panel">
							<h2>Items sold</h2>
							<div class="table-scroll">
								<table class="items-table">
									<thead>
										<tr>
											<th scope="col">Item</th>
											<th scope="col">Quantity</th>
											<th scope="col">Unit</th>
											<th scope="col">Unit price (UGX)</th>
											<th scope="col">Line total (UGX)</th>
										</tr>
									</thead>
									<tbody>
										<tr>
											<td>
												<select aria-label="Item">
													<option>Maize</option>
													<option>Beans</option>
													<option>Coffee</option>
													<option>Matooke</option>
												</select>
											</td>
											<td><input aria-label="Quantity" type="number" min="0" step="0.01"></td>
											<td>
												<select aria-label="Unit">
													<option>Bags</option>
													<option>Kg</option>
													<option>Crates</option>
												</select>
											</td>
											<td><input aria-label="Unit price in UGX" type="number" min="0" step="1"></td>
											<td><input aria-label="Line total in UGX" type="number" min="0" step="1" readonly></td>
										</tr>
									</tbody>
								</table>
							</div>
							<button class="button button-secondary" type="button">Add item</button>
						</section>

						<section class="panel">
							<h2>Terms</h2>
							<div class="field-grid">
								<div class="form-field">
									<label for="invoice-number">Invoice number</label>
									<input id="invoice-number" name="invoiceNumber" type="text" value="INV-2026-024">
								</div>
								<div class="form-field">
									<label for="issue-date">Issue date</label>
									<input id="issue-date" name="issueDate" type="date">
								</div>
								<div class="form-field">
									<label for="due-date">Due date</label>
									<input id="due-date" name="dueDate" type="date">
								</div>
								<div class="form-field">
									<label for="tax">Tax (%)</label>
									<input id="tax" name="tax" type="number" min="0" step="0.01" value="0">
								</div>
								<div class="form-field field-full">
									<label for="payment-instructions">Payment instructions</label>
									<input id="payment-instructions" name="paymentInstructions" type="text" placeholder="Mobile Money or bank transfer details">
								</div>
								<div class="form-field field-full">
									<label for="notes">Notes</label>
									<textarea id="notes" name="notes" rows="3"></textarea>
								</div>
							</div>
						</section>
					</div>

					<aside class="panel invoice-summary">
						<h2>Preview and send</h2>
						<dl>
							<div><dt>Subtotal</dt><dd>UGX 0</dd></div>
							<div><dt>Tax</dt><dd>UGX 0</dd></div>
							<div class="summary-total"><dt>Total</dt><dd>UGX 0</dd></div>
						</dl>
						<div class="form-field">
							<label for="send-method">Send by</label>
							<select id="send-method" name="sendMethod">
								<option>Email</option>
								<option>WhatsApp</option>
							</select>
						</div>
						<button class="button button-primary" type="button">Send invoice</button>
					</aside>
				</div>
			</form>
		</main>
	</div>
	<script src="../assets/sidebar.js"></script>
</body>
</html>
